{% extends 'layout.html' %}
{% block content %}
<h3>{% if type %}Edit{% else %}Create{% endif %} Violation Type</h3>
<div class="mb-3">
  <a class="btn btn-secondary" href="{{ url_for('admin_violation_types') }}">Back to Types</a>
  <a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Dashboard</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" {% if type %}action="{{ url_for('admin_violation_type_edit', vt_id=type.id) }}"{% endif %}>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ type.name if type else '' }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="active" {% if type and type.status=='active' %}selected{% endif %}>Active</option>
          <option value="inactive" {% if type and type.status=='inactive' %}selected{% endif %}>Inactive</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Applies To</label>
        <select name="applies_to" class="form-select">
          <option value="both" {% if (not type) or type.applies_to=='both' %}selected{% endif %}>Both</option>
          <option value="teacher" {% if type and type.applies_to=='teacher' %}selected{% endif %}>Teacher</option>
          <option value="staff" {% if type and type.applies_to=='staff' %}selected{% endif %}>Staff</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">{% if type %}Update{% else %}Create{% endif %}</button>
    </form>
  </div>
</div>

{% endblock %}
