{% extends 'layout.html' %}
{% block content %}
<h3>Weekly Violations Summary</h3>
<div class="mb-3">
  <a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
  <a class="btn btn-success" href="{{ url_for('admin_violations_week_export', week=week, year=year, class_id=sel_class) }}">Export to Excel</a>
</div>
<form method="get" class="mb-3">
  <div class="row">
    <div class="col-3">
      <label class="form-label">Week</label>
      <input name="week" class="form-control" value="{{ week }}" />
    </div>
    <div class="col-3">
      <label class="form-label">Year</label>
      <input name="year" class="form-control" value="{{ year }}" />
    </div>
    <div class="col-4">
      <label class="form-label">Class</label>
      <select name="class_id" class="form-select">
        <option value="">All classes</option>
        {% for c in classes %}
        <option value="{{ c.id }}" {% if sel_class and sel_class|int==c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-2">
      <label class="form-label">&nbsp;</label>
      <button class="btn btn-primary d-block">Filter</button>
    </div>
  </div>
</form>
<p>Week range: <strong>{{ monday }} — {{ sunday }}</strong></p>
<table class="table table-sm">
  <thead><tr><th>Violation</th><th>Class</th><th>Count</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r.violation_name }}</td>
      <td>{{ r.class_name or 'Unassigned' }}</td>
      <td>{{ r.cnt }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
