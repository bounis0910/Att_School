{% extends 'layout.html' %}
{% block content %}
<h3>Edit Violation</h3>
<div class="mb-3">
  <a class="btn btn-secondary" href="{{ url_for('admin_violations') }}">Back to Violations</a>
</div>

<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label">Violation Name</label>
    <input name="violation_name" class="form-control" value="{{ viol.violation_name }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Lesson Name</label>
    <input name="lesson_name" class="form-control" value="{{ viol.lesson_name }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Period</label>
    <input name="period" class="form-control" value="{{ viol.period }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Statement of Receipt</label>
    <textarea name="statement_of_receipt" class="form-control">{{ viol.statement_of_receipt }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Parental Consent</label>
    <select name="parental_consent" class="form-select">
      <option value="">-- Select --</option>
      <option value="consent" {% if viol.parental_consent == 'consent' %}selected{% endif %}>Consent</option>
      <option value="refusal" {% if viol.parental_consent == 'refusal' %}selected{% endif %}>Refusal</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Referral</label>
    <textarea name="referral" class="form-control">{{ viol.referral }}</textarea>
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
</form>

{% endblock %}
